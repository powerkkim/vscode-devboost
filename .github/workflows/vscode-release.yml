# 태그 vscode-v<버전> 을 push하면 vscode/devboost 을 빌드해 GitHub Release에 .vsix를 첨부한다.
# 예) git tag vscode-v0.2.0 && git push origin vscode-v0.2.0
name: VS Code Release

on:
  push:
    tags: ['vscode-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode/devboost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 태그와 package.json 버전 일치 확인
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "vscode-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($VERSION)이 다릅니다"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: CHANGELOG에서 이번 버전 내용 추출
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## "v"( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - run: npx vsce package

      - uses: softprops/action-gh-release@v2
        with:
          name: DevBoost (VS Code) ${{ env.VERSION }}
          body_path: vscode/devboost/release-notes.md
          files: vscode/devboost/*.vsix
