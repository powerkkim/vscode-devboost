# main 에 머지(push)되면 package.json 버전으로 태그 v<버전> 과 GitHub Release(.vsix 첨부)를 만든다.
# 태그를 따로 달 필요가 없다. 버전을 올리지 않은 머지(그 버전 태그가 이미 있음)는 릴리스를 건너뛴다.
# 손으로 다시 돌릴 때: Actions → Release → Run workflow (main)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# main 에 연달아 머지돼도 릴리스는 하나씩 차례로
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 태그 목록까지 받으려면 전체 이력이 필요

      - name: 버전 확인 (이미 릴리스한 버전이면 건너뜀)
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::v$VERSION 은 이미 릴리스했습니다. package.json 버전을 올리지 않은 머지라 릴리스를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION 을 릴리스합니다."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 태그·Release 만들기
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ripgrep 설치 (텍스트 검색 테스트용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - run: npm ci

      - name: 컴파일 + 테스트
        run: npm test

      - name: CHANGELOG에서 이번 버전 내용 추출
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## "v"( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md 에 '## $VERSION' 섹션이 없습니다. 버전을 올렸으면 CHANGELOG 도 함께 써 주세요"
            exit 1
          fi
          cat release-notes.md

      - run: npx vsce package

      # 이 머지 커밋에 태그 v<버전> 을 만들고 Release 를 연다 (GITHUB_TOKEN 으로 만든 태그는 다른 워크플로를 다시 부르지 않는다)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: DevBoost ${{ env.VERSION }}
          body_path: release-notes.md
          files: '*.vsix'
