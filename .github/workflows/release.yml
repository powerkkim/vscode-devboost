# 태그 v<버전> 을 push하면 빌드·테스트 후 GitHub Release에 .vsix를 첨부한다.
# 예) git tag v0.8.0 && git push origin v0.8.0
# 태그는 확인을 거친 main 커밋에만 단다.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ripgrep 설치 (텍스트 검색 테스트용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - run: npm ci

      - name: 태그와 package.json 버전 일치 확인
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($VERSION)이 다릅니다"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 컴파일 + 테스트
        run: npm test

      - name: CHANGELOG에서 이번 버전 내용 추출
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## "v"( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - run: npx vsce package

      - uses: softprops/action-gh-release@v2
        with:
          name: DevBoost ${{ env.VERSION }}
          body_path: release-notes.md
          files: '*.vsix'
