# 태그 v<버전> 을 push하면 빌드·테스트 후 GitHub Release에 .vsix를 첨부한다.
# 예) git tag v0.8.0 && git push origin v0.8.0
# 태그는 확인을 거친 main 커밋에만 단다. (main 에 없는 커밋이면 첫 단계에서 실패)
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # main 기록과 비교하려면 전체 이력이 필요 (기본값 1 은 최신 커밋 하나만 받음)

      # 안전장치: 태그는 브랜치와 상관없이 커밋 하나에 붙으므로, develop 에서 잘못 단 태그도 그대로 릴리스될 수 있다.
      # 태그가 붙은 커밋이 main 에 들어 있을 때(main 에서 과거로 거슬러 가면 만나는 커밋일 때)만 빌드한다.
      - name: 태그가 main 에 머지된 커밋인지 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          # HEAD = checkout 이 받은 태그의 커밋 (annotated 태그여도 커밋으로 풀려 있다)
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "$GITHUB_REF_NAME → main 에 있는 커밋입니다. 빌드를 계속합니다."
          else
            echo "::error::$GITHUB_REF_NAME 태그의 커밋($(git rev-parse --short HEAD))이 main 에 없습니다. develop → main 머지 후 main 에서 태그를 다세요."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ripgrep 설치 (텍스트 검색 테스트용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - run: npm ci

      - name: 태그와 package.json 버전 일치 확인
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($VERSION)이 다릅니다"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 컴파일 + 테스트
        run: npm test

      - name: CHANGELOG에서 이번 버전 내용 추출
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## "v"( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - run: npx vsce package

      - uses: softprops/action-gh-release@v2
        with:
          name: DevBoost ${{ env.VERSION }}
          body_path: release-notes.md
          files: '*.vsix'
