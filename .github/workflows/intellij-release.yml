# 태그 intellij-v<버전> 을 push하면 intellij/devboost 을 빌드해 GitHub Release에 .zip을 첨부한다.
# 예) git tag intellij-v0.1.0 && git push origin intellij-v0.1.0
# ※ intellij/devboost 프로젝트를 만든 뒤부터 동작합니다.
name: IntelliJ Release

on:
  push:
    tags: ['intellij-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: intellij/devboost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 태그와 gradle.properties 버전 일치 확인
        run: |
          VERSION=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          if [ "intellij-v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 pluginVersion($VERSION)이 다릅니다"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: CHANGELOG에서 이번 버전 내용 추출
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## "v"( |$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md

      - run: ./gradlew buildPlugin   # → build/distributions/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: DevBoost (IntelliJ) ${{ env.VERSION }}
          body_path: intellij/devboost/release-notes.md
          files: intellij/devboost/build/distributions/*.zip
